---
- name: Compile and Deploy Custom Procps-ng v4.0.4 (Ubuntu Only)
  hosts: linux
  become: true
  vars:
    tarball_path: "../procps-v4.0.4-princeps.tar.gz"
    # Bootstrap helpers and configure checks must run on an executable filesystem.
    build_dir: "/usr/local/src/procps_build"

  tasks:
    - name: Ensure target OS is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: "This playbook is configured exclusively for Ubuntu targets. Host OS detected: {{ ansible_distribution }}"

    - name: Install build toolchain dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - dpkg-dev
          - autoconf
          - automake
          - libtool
          - gettext
          - autopoint
          - pkg-config
          - libncurses-dev
        state: present
        update_cache: true

    - name: Detect target multiarch library directory name
      ansible.builtin.command:
        argv:
          - dpkg-architecture
          - -qDEB_HOST_MULTIARCH
      register: procps_multiarch
      changed_when: false

    - name: Resolve Ubuntu runtime library directory
      ansible.builtin.command:
        argv:
          - readlink
          - -e
          - "/lib/{{ procps_multiarch.stdout | trim }}"
      register: procps_library_dir
      changed_when: false

    - name: Remove any previous build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent

    - name: Ensure staging directory exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: '0755'

    - name: Extract custom procps tarball from relative parent directory
      ansible.builtin.unarchive:
        src: "{{ tarball_path }}"
        dest: "{{ build_dir }}"
        owner: root
        group: root
        remote_src: false
        extra_opts:
          - --strip-components=1

    - name: Find scripts in the extracted source tree
      ansible.builtin.find:
        paths: "{{ build_dir }}"
        recurse: true
        hidden: true
        file_type: file
        follow: false
        contains: '^#!'
        read_whole_file: true
        encoding: latin-1
      register: procps_scripts

    - name: Restore executable permissions on source scripts
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: file
        mode: 'u+x'
      loop: "{{ procps_scripts.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Bootstrap procps-ng build scripts
      ansible.builtin.command:
        cmd: /bin/sh ./autogen.sh
        chdir: "{{ build_dir }}"
      changed_when: true

    - name: Configure procps-ng to replace system binaries
      ansible.builtin.command:
        argv:
          - /bin/sh
          - ./configure
          - --prefix=/usr
          # Resolve /lib's multiarch directory for both merged and unmerged /usr.
          - "--libdir={{ procps_library_dir.stdout | trim }}"
        chdir: "{{ build_dir }}"
      register: configure_result
      changed_when: "'creating Makefile' in configure_result.stdout"

    - name: Remove build artifacts included in the tarball
      community.general.make:
        chdir: "{{ build_dir }}"
        target: clean

    - name: Compile procps-ng
      community.general.make:
        chdir: "{{ build_dir }}"
        target: all

    - name: Install procps-ng binaries and libraries
      community.general.make:
        chdir: "{{ build_dir }}"
        target: install

    - name: Refresh shared library bindings
      ansible.builtin.command:
        cmd: ldconfig
      changed_when: false

    - name: Verify installed ps can enumerate processes
      ansible.builtin.command:
        argv:
          - /usr/bin/ps
          - aux
      changed_when: false

    - name: Clean up temporary extraction directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent
